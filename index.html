<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0c">
<title>AK-47 — Реальная отдача · Трассеры</title>
<style>
  :root{
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sat: env(safe-area-inset-top, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0a0a0c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    user-select:none;-webkit-user-select:none;
    touch-action:none;overscroll-behavior:none;-webkit-user-drag:none;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  #look{position:fixed;inset:0;z-index:1;touch-action:none;}
  #ui{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}

  #speedBlur{
    position:absolute;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 35%, rgba(0,0,0,0.35) 75%, rgba(0,0,0,0.75) 100%);
    opacity:0; mix-blend-mode:multiply; will-change:opacity;
  }
  #chromaEdge{
    position:absolute;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 60%, rgba(80,20,10,0.35) 100%);
    opacity:0; mix-blend-mode:screen; will-change:opacity;
  }

  /* ---------- Прицел с переменным зазором ---------- */
  #crosshair{position:absolute;left:50%;top:50%;width:0;height:0;--gap:7px;}
  .ch{position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 3px rgba(0,0,0,.9);
      transition:background .08s, opacity .15s;}
  .ch-t{width:2px;height:9px;left:-1px;top:calc(-1 * var(--gap) - 9px);}
  .ch-b{width:2px;height:9px;left:-1px;top:var(--gap);}
  .ch-l{height:2px;width:9px;top:-1px;left:calc(-1 * var(--gap) - 9px);}
  .ch-r{height:2px;width:9px;top:-1px;left:var(--gap);}
  .ch-dot{position:absolute;width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%;
    background:#ff4d4d;box-shadow:0 0 4px rgba(0,0,0,.8);transition:background .08s, transform .08s, opacity .15s;}
  #crosshair.hit .ch{background:#ff3b3b;}
  #crosshair.hit .ch-dot{background:#fff;transform:scale(1.6);}

  /* ---------- Верхний HUD ---------- */
  #topbar{
    position:absolute;top:calc(10px + var(--sat));left:calc(14px + var(--sal));
    right:calc(14px + var(--sar));display:flex;justify-content:space-between;align-items:flex-start;
  }
  #healthWrap{
    position:relative;width:150px;height:26px;border-radius:13px;
    background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.22);overflow:hidden;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  #healthBar{position:absolute;left:0;top:0;bottom:0;width:100%;
    background:linear-gradient(90deg,#ff2d2d,#ff7a3b);transition:width .18s ease-out;}
  #healthText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:.5px;}
  #scoreBox{text-align:right;color:#fff;text-shadow:0 2px 8px #000;}
  #scoreBox .lbl{font-size:10px;letter-spacing:2px;opacity:.7;font-weight:700;}
  #score{font-size:22px;font-weight:900;line-height:1;}

  /* ---------- Патроны (левый верхний угол) ---------- */
  #ammoBox{
    position:absolute;
    left:calc(16px + var(--sal));
    top:calc(48px + var(--sat));
    padding:4px 12px 6px 12px;
    border-radius:8px;
    background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    font-size:30px;font-weight:900;color:#fff;letter-spacing:1px;
    text-shadow:0 3px 10px #000;font-variant-numeric:tabular-nums;
    line-height:1;
    transition:opacity .15s;
  }
  #ammoBox small{font-size:14px;opacity:.55;font-weight:700;margin-left:2px;}
  #ammoBox.empty #ammo{color:#ff4444;}
  #ammoBox.empty{animation:ammoPulse 0.6s ease-in-out infinite;}
  @keyframes ammoPulse{
    0%,100%{ background:rgba(0,0,0,.32); border-color:rgba(255,255,255,.12); }
    50%    { background:rgba(120,0,0,.45); border-color:rgba(255,60,60,.7); }
  }

  /* ---------- Джойстик ---------- */
  #joyBase{
    position:absolute;left:calc(20px + var(--sal));bottom:calc(22px + var(--sab));
    width:132px;height:132px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border:2px solid rgba(255,255,255,.25);
    pointer-events:auto;touch-action:none;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  #joyBase::after{
    content:'';position:absolute;inset:14px;border-radius:50%;
    border:1px dashed rgba(255,255,255,.14);
  }
  #joyKnob{
    position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), rgba(255,255,255,.22));
    border:2px solid rgba(255,255,255,.6);
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    will-change:transform;
  }

  /* ---------- Кнопка огня ---------- */
  #fireBtn{
    position:absolute;right:calc(24px + var(--sar));bottom:calc(30px + var(--sab));
    width:106px;height:106px;border-radius:50%;
    pointer-events:auto;touch-action:none;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;letter-spacing:1.5px;color:#fff;
    background:radial-gradient(circle at 35% 28%, rgba(255,110,110,.55), rgba(170,20,20,.5));
    border:3px solid rgba(255,120,120,.75);
    box-shadow:0 6px 22px rgba(255,40,40,.28), inset 0 0 24px rgba(255,80,80,.25);
    text-shadow:0 2px 4px rgba(0,0,0,.6);
    transition:transform .06s, box-shadow .06s;
  }
  #fireBtn.active{transform:scale(.93);box-shadow:0 0 34px rgba(255,60,60,.6);}

  /* ---------- Кнопка перезарядки ---------- */
  #reloadBtn{
    position:absolute;right:calc(148px + var(--sar));bottom:calc(48px + var(--sab));
    width:66px;height:66px;border-radius:50%;
    pointer-events:auto;touch-action:none;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:9px;font-weight:800;letter-spacing:.5px;line-height:1.1;color:#fff;
    background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.35);
    text-shadow:0 1px 3px #000;
    transition:opacity .15s, transform .08s;
  }
  #reloadBtn.active{opacity:.35;transform:scale(.94);}

  /* ---------- Кнопка ПРИЦЕЛ ---------- */
  #scopeBtn{
    position:absolute;right:calc(39px + var(--sar));bottom:calc(150px + var(--sab));
    width:76px;height:76px;border-radius:50%;
    pointer-events:auto;touch-action:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:10px;font-weight:900;letter-spacing:1px;line-height:1.15;color:#fff;
    background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.4);
    text-shadow:0 1px 3px #000;
    transition:transform .08s, background .18s, border-color .18s, box-shadow .18s;
  }
  #scopeBtn .ico{
    width:22px;height:22px;border-radius:50%;
    border:2px solid rgba(255,255,255,.85);
    position:relative;margin-bottom:3px;
  }
  #scopeBtn .ico::before,
  #scopeBtn .ico::after{content:'';position:absolute;background:rgba(255,255,255,.85);}
  #scopeBtn .ico::before{left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;}
  #scopeBtn .ico::after{top:50%;left:-4px;right:-4px;height:2px;margin-top:-1px;}
  #scopeBtn .ico i{
    position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.85);transform:translate(-50%,-50%);
  }
  #scopeBtn.active{
    background:radial-gradient(circle at 40% 30%, rgba(255,190,80,.4), rgba(180,90,10,.35));
    border-color:rgba(255,190,80,.95);
    box-shadow:0 0 22px rgba(255,180,60,.55), inset 0 0 14px rgba(255,180,60,.35);
    transform:scale(.96);
  }
  #scopeBtn.active .ico{border-color:#fff;}
  #scopeBtn.active .ico::before,
  #scopeBtn.active .ico::after{background:#fff;}

  #damageFlash{
    position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5;
    background:radial-gradient(circle at 50% 50%, rgba(255,0,0,0) 35%, rgba(190,0,0,.85) 100%);
    transition:opacity .12s ease-out;
  }

  .screen{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;color:#fff;padding:24px;
    background:radial-gradient(circle at 50% 40%, #1a1c22, #07080a 75%);
    pointer-events:auto;
  }
  .screen h1{
    font-size:clamp(38px,13vw,72px);font-weight:900;letter-spacing:6px;
    background:linear-gradient(180deg,#fff,#ff7a3b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,120,60,.35);
  }
  .screen h2{font-size:clamp(26px,8vw,44px);font-weight:900;letter-spacing:3px;color:#ff4040;}
  .screen p{font-size:14px;opacity:.65;letter-spacing:2px;text-transform:uppercase;}
  .screen button{
    margin-top:10px;padding:16px 52px;border:none;border-radius:40px;
    font-size:17px;font-weight:900;letter-spacing:3px;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#ff6a3d,#c02a12);
    box-shadow:0 8px 28px rgba(255,80,40,.4);
    transition:transform .1s;
  }
  .screen button:active{transform:scale(.95);}
  .hint{margin-top:18px;font-size:12px;line-height:1.9;opacity:.5;letter-spacing:.5px;}
  #gameOver{display:none;background:radial-gradient(circle at 50% 40%, #2a0d0d, #07080a 75%);}
  #gameOver.show{display:flex;}
</style>
</head>
<body>

<div id="app"></div>
<div id="look"></div>

<div id="ui">
  <div id="crosshair">
    <div class="ch ch-t"></div><div class="ch ch-b"></div>
    <div class="ch ch-l"></div><div class="ch ch-r"></div>
    <div class="ch-dot"></div>
  </div>

  <div id="topbar">
    <div id="healthWrap">
      <div id="healthBar"></div>
      <span id="healthText">100</span>
    </div>
    <div id="scoreBox">
      <div class="lbl">УБИТО</div>
      <div id="score">0</div>
    </div>
  </div>

  <div id="ammoBox"><span id="ammo">30</span><small>/ ∞</small></div>

  <div id="joyBase"><div id="joyKnob"></div></div>

  <div id="reloadBtn">ПЕРЕ-<br>ЗАРЯД</div>
  <div id="scopeBtn">
    <div class="ico"><i></i></div>
    ПРИЦЕЛ
  </div>
  <div id="fireBtn">ОГОНЬ</div>

  <div id="speedBlur"></div>
  <div id="chromaEdge"></div>
  <div id="damageFlash"></div>
</div>

<div id="startScreen" class="screen">
  <h1>AK-47</h1>
  <p>Трассеры · Реальная отдача</p>
  <button id="startBtn">ИГРАТЬ</button>
  <div class="hint">
    Левый джойстик — движение<br>
    Свайп по экрану — обзор · «ПРИЦЕЛ» — мушка<br>
    «ОГОНЬ» — стрельба · «ПЕРЕЗАРЯД» — магазин<br>
    <span style="color:#ff9955">Ствол резко подбрасывает вверх — веди короткими очередями</span>
  </div>
</div>

<div id="gameOver" class="screen">
  <h2>ВЫ ПОГИБЛИ</h2>
  <p>Уничтожено: <span id="finalScore">0</span></p>
  <button id="restartBtn">ЗАНОВО</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   КОНСТАНТЫ
============================================================ */
const BOUND       = 60;
const MAG_SIZE    = 30;
const FIRE_RATE   = 0.095;
const RELOAD_TIME = 2.3;
const SENS        = 0.0032;
const MAX_ENEMIES = 5;

const FOV_HIP = 75;
const FOV_ADS = 42;

const DEG2RAD = Math.PI / 180;

const TRACER_SPEED = 260; // м/с — видимые, но быстрые

const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a) * t;
const rand  = (a,b) => a + Math.random() * (b-a);

/* ============================================================
   === ПАТТЕРН ОТДАЧИ АК-47 (усиленная вертикаль) ===
   [вертикаль(°), горизонталь(°)] на каждый выстрел
   Первые 3 — резкий подброс ствола вверх
   4-10 — увод вправо-вверх (J-паттерн)
   11-20 — сброс влево
   21-30 — рыскание вправо
============================================================ */
const AK_PATTERN = [
  [2.05,  0.00], [1.90,  0.06], [1.76,  0.14], [1.62,  0.26],
  [1.50,  0.40], [1.38,  0.54], [1.26,  0.66], [1.16,  0.76],
  [1.06,  0.84], [0.97,  0.90], [0.88,  0.92], [0.80,  0.88],
  [0.73,  0.78], [0.68,  0.60], [0.63,  0.38], [0.59,  0.12],
  [0.55, -0.14], [0.52, -0.40], [0.49, -0.60], [0.45, -0.74],
  [0.42, -0.80], [0.40, -0.78], [0.37, -0.66], [0.35, -0.46],
  [0.33, -0.22], [0.31,  0.04], [0.30,  0.30], [0.28,  0.52],
  [0.26,  0.68], [0.25,  0.74],
];

/* ============================================================
   РЕНДЕРЕР / СЦЕНА
============================================================ */
const renderer = new THREE.WebGLRenderer({
  antialias: window.devicePixelRatio < 2,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fa8bd);
scene.fog = new THREE.Fog(0x8fa8bd, 35, 130);

const camera = new THREE.PerspectiveCamera(FOV_HIP, window.innerWidth/window.innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* ============================================================
   СВЕТ
============================================================ */
scene.add(new THREE.HemisphereLight(0xbdd6ff, 0x4a4438, 1.15));

const sun = new THREE.DirectionalLight(0xfff0cf, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left   = -35;
sun.shadow.camera.right  =  35;
sun.shadow.camera.top    =  35;
sun.shadow.camera.bottom = -35;
sun.shadow.camera.near   = 1;
sun.shadow.camera.far    = 140;
sun.shadow.bias = -0.0012;
scene.add(sun);
scene.add(sun.target);

/* ============================================================
   ЗЕМЛЯ
============================================================ */
function makeGroundTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a5340'; ctx.fillRect(0,0,256,256);
  ctx.fillStyle = '#525c47';
  for(let i=0;i<8;i++) for(let j=0;j<8;j++) if((i+j)%2===0) ctx.fillRect(i*32,j*32,32,32);
  const img = ctx.getImageData(0,0,256,256);
  for(let i=0;i<img.data.length;i+=4){
    const n = (Math.random()-0.5)*26;
    img.data[i]   = clamp(img.data[i]+n,0,255);
    img.data[i+1] = clamp(img.data[i+1]+n,0,255);
    img.data[i+2] = clamp(img.data[i+2]+n,0,255);
  }
  ctx.putImageData(img,0,0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(70,70);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   ПРЕПЯТСТВИЯ
============================================================ */
const obstacles = [];
const obstacleMeshes = [];

function addBox(x, y, z, w, h, d, color){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.88, metalness: 0.05 })
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  const box = new THREE.Box3().setFromObject(mesh);
  obstacles.push({ mesh, box });
  obstacleMeshes.push(mesh);
  return mesh;
}

for(let i=0; i<30; i++){
  const a = Math.random() * Math.PI * 2;
  const r = 9 + Math.random() * 44;
  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r;

  if(Math.random() < 0.62){
    const s = rand(1.2, 2.4);
    addBox(x, s/2, z, s, s, s, Math.random()<.5 ? 0x8a6a44 : 0x6f5535);
  } else {
    const w = rand(3, 7);
    const h = rand(1.4, 2.6);
    const d = rand(0.6, 1.0);
    addBox(x, h/2, z, w, h, d, 0x6d6e73);
  }
}

const wallMat = 0x55575c;
addBox(0, 3, -BOUND, BOUND*2, 6, 1.2, wallMat);
addBox(0, 3,  BOUND, BOUND*2, 6, 1.2, wallMat);
addBox(-BOUND, 3, 0, 1.2, 6, BOUND*2, wallMat);
addBox( BOUND, 3, 0, 1.2, 6, BOUND*2, wallMat);

/* ============================================================
   ОРУЖИЕ — АК-47
============================================================ */
const gun = new THREE.Group();
camera.add(gun);

function createAK47(){
  const g = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: 0x24242a, roughness: 0.42, metalness: 0.9 });
  const wood  = new THREE.MeshStandardMaterial({ color: 0x7d4a1f, roughness: 0.78, metalness: 0.02 });
  const dark  = new THREE.MeshStandardMaterial({ color: 0x131316, roughness: 0.62, metalness: 0.55 });
  const white = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5, metalness: 0.3 });

  const add = (geo, mat, x, y, z, rx=0, ry=0, rz=0) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.rotation.set(rx, ry, rz);
    m.castShadow = false; m.receiveShadow = false;
    g.add(m);
    return m;
  };

  add(new THREE.BoxGeometry(0.072, 0.10, 0.34), metal, 0, 0, 0);
  add(new THREE.BoxGeometry(0.066, 0.028, 0.26), dark, 0, 0.062, -0.02);
  add(new THREE.CylinderGeometry(0.016, 0.016, 0.46, 10), metal, 0, 0.022, -0.40, Math.PI/2);
  add(new THREE.CylinderGeometry(0.012, 0.012, 0.30, 8), metal, 0, 0.076, -0.31, Math.PI/2);
  add(new THREE.BoxGeometry(0.058, 0.078, 0.20), wood, 0, 0.012, -0.27);
  add(new THREE.BoxGeometry(0.05, 0.038, 0.17), wood, 0, 0.075, -0.26);
  add(new THREE.BoxGeometry(0.024, 0.05, 0.024), dark, 0, 0.062, -0.575);
  add(new THREE.BoxGeometry(0.012, 0.062, 0.012), dark, 0, 0.098, -0.575);
  add(new THREE.BoxGeometry(0.01, 0.06, 0.014), dark, -0.022, 0.094, -0.575);
  add(new THREE.BoxGeometry(0.01, 0.06, 0.014), dark,  0.022, 0.094, -0.575);
  add(new THREE.BoxGeometry(0.006, 0.008, 0.004), white, 0, 0.098, -0.582);
  add(new THREE.CylinderGeometry(0.023, 0.023, 0.065, 8), dark, 0, 0.022, -0.645, Math.PI/2);

  add(new THREE.BoxGeometry(0.05, 0.022, 0.05), dark, 0, 0.072, 0.03);
  add(new THREE.BoxGeometry(0.008, 0.026, 0.008), dark, -0.014, 0.086, 0.03);
  add(new THREE.BoxGeometry(0.008, 0.026, 0.008), dark,  0.014, 0.086, 0.03);
  add(new THREE.BoxGeometry(0.004, 0.006, 0.003), white, 0, 0.086, 0.024);

  for(let i=0; i<3; i++){
    add(new THREE.BoxGeometry(0.046, 0.072, 0.078), dark,
      0, -0.085 - i*0.062, -0.012 - i*0.026, 0.26 + i*0.16);
  }

function spawnTracerBullet(from, dir, distance){
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffe088,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const m = new THREE.Mesh(TRACER_GEO, mat);
  m.position.copy(from);
  // Растягиваем шар по направлению полёта — эффект "искры-полосы"
  m.scale.set(0.7, 0.7, 3.0);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().normalize());
  scene.add(m);

  // Мини-свет для реализма (только ближние пули)
  const light = new THREE.PointLight(0xffcc66, 1.6, 4, 2);
  m.add(light);

  tracers.push({
    mesh: m,
    mat,
    light,
    vel: dir.clone().normalize().multiplyScalar(TRACER_SPEED),
    life: 0,
    max: Math.max(0.05, distance / TRACER_SPEED)
  });
}

function updateTracers(dt){
  for(let i = tracers.length - 1; i >= 0; i--){
    const t = tracers[i];
    t.life += dt;
    t.mesh.position.addScaledVector(t.vel, dt);

    // Гашение ближе к концу пути
    const k = 1 - t.life / t.max;
    t.mat.opacity = Math.max(0, k);
    if(t.light) t.light.intensity = 1.6 * Math.max(0, k);

    // Масштаб растёт при движении (эффект "растягивания")
    const s = 0.7 + (1 - k) * 0.6;
    t.mesh.scale.set(s * 0.7, s * 0.7, 3.0 + (1-k) * 1.5);

    if(t.life >= t.max){
      scene.remove(t.mesh);
      t.mat.dispose();
      tracers.splice(i, 1);
    }
  }
}

let audioCtx = null, noiseBuf = null, masterGain = null;

function initAudio(){
  if(audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.32;
    masterGain.connect(audioCtx.destination);

    const len = Math.floor(audioCtx.sampleRate * 0.35);
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0; i<len; i++) d[i] = Math.random()*2 - 1;
  } catch(e){ console.warn('Audio недоступен', e); }
}

function playShot(){
  if(!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;

  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  src.playbackRate.value = rand(0.92, 1.1);

  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(2600, t);
  filt.frequency.exponentialRampToValueAtTime(500, t + 0.11);
  filt.Q.value = 0.9;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.16);

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(42, t + 0.09);
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.42, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  osc.connect(g2); g2.connect(masterGain);
  osc.start(t); osc.stop(t + 0.12);
}

function playClick(freq = 320, dur = 0.06, vol = 0.2){
  if(!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, t);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.01);
}

function playHit(){ playClick(140, 0.09, 0.28); }

function playFootstep(power){
  if(!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  src.playbackRate.value = rand(0.55, 0.8);

  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(500, t);
  filt.frequency.exponentialRampToValueAtTime(180, t + 0.08);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.10 * power, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);

  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.13);
}

class Enemy {

    this.model = new THREE.Group();

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb03a3a, roughness: 0.78 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0x2b2b33, roughness: 0.55, metalness: 0.2 });
    const limbMat = new THREE.MeshStandardMaterial({ color: 0x3a3a44, roughness: 0.85 });

    this.model.add(body);

    head.position.y = 1.74;
    head.castShadow = true;
    this.model.add(head);

    for(const s of [-1, 1]){
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.62, 0.14), limbMat);
      arm.position.set(s * 0.37, 1.12, 0);
      arm.castShadow = true;
      this.model.add(arm);
    }
    for(const s of [-1, 1]){
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.72, 0.18), limbMat);
      leg.position.set(s * 0.17, 0.36, 0);
      leg.castShadow = true;
      this.model.add(leg);
    }

    this.bar = new THREE.Group();
    const bg = new THREE.Mesh(
      new THREE.PlaneGeometry(0.92, 0.12),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.55, depthTest: false })
    );
    this.barFill = new THREE.Mesh(
      new THREE.PlaneGeometry(0.88, 0.075),
      new THREE.MeshBasicMaterial({ color: 0x33dd55, depthTest: false })
    );
    this.barFill.geometry.translate(0.44, 0, 0);
    this.barFill.position.set(-0.44, 0, 0.002);
    this.bar.add(bg, this.barFill);
    this.bar.renderOrder = 20;
    this.bar.position.set(x, 2.25, z);
    scene.add(this.bar);

    scene.add(this.group);
  }

  damage(amount){
    if(this.dead) return;
    this.hp -= amount;
    const k = Math.max(0, this.hp / this.maxHp);
    this.barFill.scale.x = k;
    this.barFill.material.color.setHex(k > 0.5 ? 0x33dd55 : k > 0.25 ? 0xffcc33 : 0xff3333);
    playHit();
    if(this.hp <= 0) this.die();
  }

  die(){
    this.dead = true;
    this.dieT = 0.001;
    kills++;
    document.getElementById('score').textContent = kills;
    playClick(90, 0.22, 0.3);
  }

  update(dt){
    if(this.dead){
      this.dieT += dt;
      const t = Math.min(this.dieT / 0.55, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      this.model.rotation.x = -ease * Math.PI * 0.5;
      this.model.position.y = -ease * 0.25;
      this.bar.visible = false;
      if(this.dieT > 1.7) this.remove();
      return;
    }

    const dx = player.pos.x - this.group.position.x;
    const dz = player.pos.z - this.group.position.z;
    const dist = Math.hypot(dx, dz) || 0.0001;

    if(dist > 1.9){
      const nx = dx / dist, nz = dz / dist;
      this.group.position.x += nx * this.speed * dt;
      this.group.position.z += nz * this.speed * dt;
      resolveCollisions(this.group.position, 0.5);
      this.walkPhase += dt * this.speed * 4.2;
      this.model.position.y = Math.abs(Math.sin(this.walkPhase)) * 0.045;
      this.model.rotation.z = Math.sin(this.walkPhase) * 0.035;
    } else {
      this.model.position.y = 0;
      this.attackCd -= dt;
      if(this.attackCd <= 0){
        this.attackCd = 1.25;
        damagePlayer(8);
      }
    }

    this.group.rotation.y = Math.atan2(dx, dz);
    this.bar.position.set(this.group.position.x, 2.28, this.group.position.z);
    this.bar.quaternion.copy(camera.quaternion);
  }

  remove(){
    scene.remove(this.group);
    scene.remove(this.bar);
    this.group.traverse(o => {
      if(o.geometry) o.geometry.dispose();
      if(o.material) o.material.dispose();
    });
    this.bar.traverse(o => {
      if(o.geometry) o.geometry.dispose();
      if(o.material) o.material.dispose();
    });
    const i = enemies.indexOf(this);
    if(i >= 0) enemies.splice(i, 1);
  }
}

/* ============================================================
   КОЛЛИЗИИ
============================================================ */
function resolveCollisions(pos, radius){
  for(let i = 0; i < obstacles.length; i++){
    const b = obstacles[i].box;
    const cx = clamp(pos.x, b.min.x, b.max.x);
    const cz = clamp(pos.z, b.min.z, b.max.z);
    let dx = pos.x - cx;
    let dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;

    if(d2 < radius * radius){
      if(d2 > 1e-8){
        const d = Math.sqrt(d2);
        const push = (radius - d) / d;
        pos.x += dx * push;
        pos.z += dz * push;
      } else {
        const dl = pos.x - b.min.x, dr = b.max.x - pos.x;
        const db = pos.z - b.min.z, dtp = b.max.z - pos.z;
        const m = Math.min(dl, dr, db, dtp);
        if(m === dl)      pos.x = b.min.x - radius;
        else if(m === dr) pos.x = b.max.x + radius;
        else if(m === db) pos.z = b.min.z - radius;
        else              pos.z = b.max.z + radius;
      }
    }
  }
  pos.x = clamp(pos.x, -BOUND + 1.5, BOUND - 1.5);
  pos.z = clamp(pos.z, -BOUND + 1.5, BOUND - 1.5);
}

const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joy = { id: null, x: 0, y: 0 };
let joyMax = 46;

function updateJoy(e){
  const r = joyBase.getBoundingClientRect();
  joyMax = r.width / 2 - 12;
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if(dist > joyMax){
    dx = dx / dist * joyMax;
    dy = dy / dist * joyMax;
  }
  joy.x = dx / joyMax;
  joy.y = dy / joyMax;
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}

joyBase.addEventListener('pointerdown', e => {
  if(joy.id !== null) return;
  joy.id = e.pointerId;
  try { joyBase.setPointerCapture(e.pointerId); } catch(_){}
  updateJoy(e);
});

joyBase.addEventListener('pointermove', e => {
  if(e.pointerId === joy.id) updateJoy(e);
});

function endJoy(e){
  if(e.pointerId !== joy.id) return;
  joy.id = null; joy.x = 0; joy.y = 0;
  joyKnob.style.transform = 'translate(0px, 0px)';
}

  /* ---------- РЕАЛЬНАЯ ОТДАЧА АК-47 ---------- */
  const idx = Math.min(shotsInBurst, AK_PATTERN.length - 1);
  const [vDeg, hDeg] = AK_PATTERN[idx];

  const jitterV = 1 + (Math.random() - 0.5) * 0.30;
  const jitterH = 1 + (Math.random() - 0.5) * 0.90;

  const recoilMul = 1 - aimT * 0.45;

  const vKick = vDeg * jitterV * recoilMul;
  const hKick = hDeg * jitterH * recoilMul;

  /* --- Камера: накопление отдачи --- */
  camRecoilPitch += vKick * DEG2RAD;
  camRecoilYaw   += hKick * DEG2RAD;

  /* --- Физика оружия: импульс пружинам --- */
  gunRecoilZVel     += 1.1 * recoilMul;
  gunRecoilPitchVel += vKick * 3.6;   // ← усилено (было 2.4)
  gunRecoilYawVel   += hKick * 2.4;
  gunRecoilRollVel  += (hKick * 1.7 + (Math.random() - 0.5) * 0.5) * recoilMul;

  /* --- Тряска --- */
  addShake(0.011 * recoilMul);

  /* --- Расширение прицела --- */
  crosshairSpread = Math.min(1, crosshairSpread + 0.14);

  shotsInBurst++;

  /* --- Вспышка --- */
  flashT = 0.05;
  flashMat.opacity = 1;
  muzzleLight.intensity = 6;
  muzzleFlash.rotation.z += Math.random() * Math.PI * 2;

  /* ---------- ПУЛЯ (hitscan) ---------- */
  camera.getWorldDirection(_dir);
  _right.crossVectors(_dir, camera.up).normalize();
  _up.crossVectors(_right, _dir).normalize();

  const accum = Math.hypot(camRecoilPitch, camRecoilYaw);
  const baseSpread = 0.004 + Math.min(accum * 0.9, 0.035);
  const spread = baseSpread * (1 - aimT * 0.7);

  _dir.addScaledVector(_right, (Math.random() - 0.5) * spread)
      .addScaledVector(_up,    (Math.random() - 0.5) * spread)
      .normalize();

  camera.getWorldPosition(_origin);
  raycaster.set(_origin, _dir);

  const targets = [ground, ...obstacleMeshes, ...enemies.map(e => e.group)];
  const hits = raycaster.intersectObjects(targets, true);

  camera.updateMatrixWorld(true);
  _muzzle.set(0, 0.022, -0.72);
  gun.localToWorld(_muzzle);

  let hit = null;
  for(const h of hits){
    if(h.distance < 0.4) continue;
    hit = h;
    break;
  }

  /* ---------- ТРАССЕР: летящая пуля ---------- */
  if(hit){
    _endPoint.copy(hit.point);
  } else {
    _endPoint.copy(_origin).addScaledVector(_dir, 120);
  }
  const tracerDir = _endPoint.clone().sub(_muzzle).normalize();
  const tracerDist = _muzzle.distanceTo(_endPoint);
  spawnTracerBullet(_muzzle.clone(), tracerDir, Math.min(tracerDist, 120));

  /* ---------- Попадание ---------- */
  if(hit){
    const enemy = findEnemy(hit.object);
    if(enemy){
      enemy.damage(35);
      spawnImpact(hit.point, hit.face ? hit.face.normal : _tmp.set(0,1,0), 0xff3344);
      crosshair.classList.add('hit');
      clearTimeout(crosshair._t);
      crosshair._t = setTimeout(() => crosshair.classList.remove('hit'), 90);
    } else {
      spawnImpact(hit.point, hit.face ? hit.face.normal : _tmp.set(0,1,0), 0xffcc66);
    }
  }
}

/* ============================================================
   УРОН ИГРОКУ
============================================================ */
let damageAlpha = 0;

function damagePlayer(amount){
  if(!gameRunning || player.health <= 0) return;
  player.health = Math.max(0, player.health - amount);
  healthBar.style.width = player.health + '%';
  healthTxt.textContent = Math.ceil(player.health);
  damageAlpha = Math.min(1, damageAlpha + 0.55);

  addShake(0.02);
  camRoll += (Math.random() - 0.5) * 0.04;

  if(player.health <= 0) endGame();
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
============================================================ */
let lastTime = performance.now();

function update(dt){
  /* ---- Прицеливание ---- */
  const targetAim = (aiming && !reloading) ? 1 : 0;
  aimT = lerp(aimT, targetAim, 1 - Math.exp(-dt * 13));

  const targetFov = lerp(FOV_HIP, FOV_ADS, aimT);
  if(Math.abs(camera.fov - targetFov) > 0.02){
    camera.fov = targetFov;
    camera.updateProjectionMatrix();
  }

  crosshair.style.opacity = String(1 - aimT * 0.9);

  /* ---- Движение ---- */
  const jl = Math.hypot(joy.x, joy.y);
  let mx = 0, mz = 0, speedNow = 0;
  let strafe = 0;

  if(jl > 0.14){
    const scale = Math.min(1, jl) / jl;
    const nx = joy.x * scale;
    const ny = joy.y * scale;
    const fwd = -ny;
    const str = nx;
    strafe = str;

    const sy = Math.sin(player.yaw);
    const cy = Math.cos(player.yaw);
    mx = (-sy) * fwd + cy * str;
    mz = (-cy) * fwd + (-sy) * str;

    const len = Math.hypot(mx, mz);
    if(len > 1){ mx /= len; mz /= len; }
    speedNow = Math.min(1, len);
  }

  const moveSpeed = player.speed * (1 - aimT * 0.5);
  player.pos.x += mx * moveSpeed * dt;
  player.pos.z += mz * moveSpeed * dt;
  resolveCollisions(player.pos, player.radius);

  /* ---- Отслеживание поворота ---- */
  const yawDelta = player.yaw - prevYaw;
  const pitchDelta = player.pitch - prevPitch;
  prevYaw = player.yaw;
  prevPitch = player.pitch;
  const turnRate = yawDelta / Math.max(dt, 0.0001);

  /* ---- Крен камеры ---- */
  let targetRoll = 0;
  targetRoll += -strafe * 0.075 * (1 - aimT * 0.5);
  targetRoll += clamp(-turnRate * 0.014, -0.09, 0.09);
  camRoll = lerp(camRoll, targetRoll, 1 - Math.exp(-dt * 9));

  /* ---- Затухание тряски ---- */
  camShakeX *= Math.exp(-dt * 15);
  camShakeY *= Math.exp(-dt * 15);
  camShakeR *= Math.exp(-dt * 15);

  /* ============================================================
     ОТДАЧА: интегрирование
  ============================================================ */
  if(!firing || ammo === 0 || reloading){
    shotsInBurst = Math.max(0, shotsInBurst - dt * 22);
  }

  // Камера возвращается медленнее — отдача накапливается
  const camDecay = Math.exp(-dt * 4.5);
  camRecoilPitch *= camDecay;
  camRecoilYaw   *= camDecay;

  // Пружины оружия
  const gK = 130;
  const gD = 18;

  gunRecoilZVel     += (-gunRecoilZ)     * gK * dt - gunRecoilZVel     * gD * dt;
  gunRecoilPitchVel += (-gunRecoilPitch) * gK * dt - gunRecoilPitchVel * gD * dt;
  gunRecoilYawVel   += (-gunRecoilYaw)   * gK * dt - gunRecoilYawVel   * gD * dt;
  gunRecoilRollVel  += (-gunRecoilRoll)  * gK * dt - gunRecoilRollVel  * gD * dt;

  gunRecoilZ     += gunRecoilZVel     * dt;
  gunRecoilPitch += gunRecoilPitchVel * dt;
  gunRecoilYaw   += gunRecoilYawVel   * dt;
  gunRecoilRoll  += gunRecoilRollVel  * dt;

  // Пределы (вертикаль увеличена)
  gunRecoilZ     = clamp(gunRecoilZ,     -0.02, 0.09);
  gunRecoilPitch = clamp(gunRecoilPitch, -0.15, 0.60);   // ← было 0.35
  gunRecoilYaw   = clamp(gunRecoilYaw,   -0.22, 0.22);
  gunRecoilRoll  = clamp(gunRecoilRoll,  -0.30, 0.30);
  camRecoilPitch = clamp(camRecoilPitch, -0.05, 0.70);   // ← было 0.45
  camRecoilYaw   = clamp(camRecoilYaw,   -0.28, 0.28);

  // Зазор прицела
  crosshairSpread *= Math.exp(-dt * 3.6);
  const gap = 7 + crosshairSpread * 16;
  crosshair.style.setProperty('--gap', gap.toFixed(2) + 'px');

  /* ---- Пружина оружия (инерция) ---- */
  const swayMul = 1 - aimT * 0.55;
  const targetSwayX = clamp(-yawDelta * 3.2, -0.09, 0.09) * swayMul;
  const targetSwayY = clamp(-pitchDelta * 2.8, -0.07, 0.07) * swayMul;
  const kSway = 110, dSway = 17;
  swayVX += (targetSwayX - swayX) * kSway * dt - swayVX * dSway * dt;
  swayVY += (targetSwayY - swayY) * kSway * dt - swayVY * dSway * dt;
  if(dt > 0.001){
    swayX += swayVX * dt;
    swayY += swayVY * dt;
  }

  /* ---- Дыхание ---- */
  const breatheRate = lerp(1.3, 2.0, aimT);
  breathePhase += dt * breatheRate;
  const idle = 1 - Math.min(1, speedNow * 2.5);
  const breatheAmp = lerp(0.0055, 0.0022, aimT);
  const breatheY = Math.sin(breathePhase * 2) * breatheAmp * idle;
  const breatheX = Math.sin(breathePhase * 1.3) * breatheAmp * 0.7 * idle;

  /* ---- Шаги ---- */
  const targetBobAmt = speedNow > 0.05 ? speedNow : 0;
  bobAmount = lerp(bobAmount, targetBobAmt, 1 - Math.exp(-dt * 9));

  if(speedNow > 0.05){
    stepPhase += dt * 8.2 * speedNow;
    bobY = Math.sin(stepPhase * 2) * 0.026 * bobAmount;
    bobX = Math.sin(stepPhase) * 0.020 * bobAmount;
    bobRoll = Math.sin(stepPhase) * 0.016 * bobAmount;

    const prevStep = Math.floor(lastStepPhase / Math.PI);
    const currStep = Math.floor(stepPhase / Math.PI);
    if(currStep > prevStep){
      stepDip = Math.min(stepDip + 0.014 * speedNow, 0.022);
      playFootstep(0.6 + speedNow * 0.4);
    }
    lastStepPhase = stepPhase;
  } else {
    bobY = lerp(bobY, 0, 1 - Math.exp(-dt * 12));
    bobX = lerp(bobX, 0, 1 - Math.exp(-dt * 12));
    bobRoll = lerp(bobRoll, 0, 1 - Math.exp(-dt * 12));
    if(speedNow < 0.02){ stepPhase = 0; lastStepPhase = 0; }
  }
  stepDip *= Math.exp(-dt * 22);

  /* ---- Камера (с отдачей) ---- */
  camera.position.set(
    player.pos.x,
    player.eye + bobY - stepDip + camShakeY * 0.5,
    player.pos.z
  );
  camera.rotation.y = player.yaw + camShakeX - camRecoilYaw;
  camera.rotation.x = player.pitch + camShakeY - camRecoilPitch;
  camera.rotation.z = camRoll + bobRoll + camShakeR + gunRecoilRoll * 0.18;

  /* ---- Свет ---- */
  sun.position.set(player.pos.x + 28, 52, player.pos.z + 18);
  sun.target.position.set(player.pos.x, 0, player.pos.z);
  sun.target.updateMatrixWorld();

  /* ---- Перезарядка ---- */
  if(reloading){
    reloadTimer -= dt;
    if(reloadTimer <= 0){
      reloading = false;
      ammo = MAG_SIZE;
      updateAmmoHUD();
      reloadBtn.classList.remove('active');
      playClick(420, 0.06, 0.22);
    }
  }

  /* ---- Стрельба ---- */
  fireCooldown -= dt;
  if(firing && gameRunning){
    if(reloading){ /* ждём */ }
    else if(ammo > 0){
      if(fireCooldown <= 0){
        shoot();
        fireCooldown = FIRE_RATE;
      }
    } else {
      startReload();
    }
  }

  /* ---- Анимация оружия ---- */
  const reloadP = reloading
    ? Math.sin((1 - reloadTimer / RELOAD_TIME) * Math.PI)
    : 0;

  const gx = lerp(GUN_HIP_POS.x, GUN_ADS_POS.x, aimT);
  const gy = lerp(GUN_HIP_POS.y, GUN_ADS_POS.y, aimT);
  const gz = lerp(GUN_HIP_POS.z, GUN_ADS_POS.z, aimT);

  const bobMul = 1 - aimT * 0.75;

  gun.position.x = gx + bobX * 0.55 * bobMul + swayX + breatheX + camShakeX * 0.4
                       + gunRecoilYaw * 0.06;
  gun.position.y = gy + bobY * 0.75 * bobMul + swayY + breatheY
                       - stepDip * 0.6
                       - reloadP * 0.13
                       + camShakeY * 0.6
                       + gunRecoilPitch * 0.05;    // ← усилено (было 0.035)
  gun.position.z = gz + gunRecoilZ;

  gun.rotation.x = gunRecoilPitch + reloadP * 0.65 + swayY * 2.4;
  gun.rotation.y = gunRecoilYaw   + swayX * 2.6 + bobRoll * 0.8;
  gun.rotation.z = gunRecoilRoll  + reloadP * 0.25 + bobRoll * 1.4 + camShakeR * 0.8;

  /* ---- Вспышка ---- */
  if(flashT > 0){
    flashT -= dt;
    const k = Math.max(0, flashT / 0.05);
    flashMat.opacity = k;
    muzzleLight.intensity = k * 6;
  } else {
    flashMat.opacity = 0;
    muzzleLight.intensity = 0;
  }

  /* ---- Враги ---- */
  for(let i = enemies.length - 1; i >= 0; i--){
    enemies[i].update(dt);
  }

  spawnTimer -= dt;
  if(spawnTimer <= 0 && enemies.length < MAX_ENEMIES){
    spawnEnemy();
    const progress = Math.min(1, kills / 25);
    spawnTimer = lerp(2.6, 1.2, progress);
  }

  /* ---- Эффекты / трассеры / гильзы ---- */
  updateEffects(dt);
  updateTracers(dt);
  updateShells(dt);

  /* ---- Вспышка урона ---- */
  if(damageAlpha > 0){
    damageAlpha = Math.max(0, damageAlpha - dt * 2.4);
    dmgFlash.style.opacity = damageAlpha;
  }

  /* ---- Виньетка скорости ---- */
  const speedFactor = bobAmount;
  const turnFactor = Math.min(1, Math.abs(turnRate) * 0.12);
  const targetBlur = clamp(speedFactor * 0.55 + turnFactor * 0.6, 0, 0.8);
  blurLevel = lerp(blurLevel, targetBlur, 1 - Math.exp(-dt * 6));
  speedBlurEl.style.opacity = blurLevel;
  chromaEdgeEl.style.opacity = blurLevel * 0.45;

  /* ---- HP-реген ---- */
  if(player.health > 0 && player.health < 100 && damageAlpha <= 0){
    player.health = Math.min(100, player.health + dt * 1.6);
    healthBar.style.width = player.health + '%';
    healthTxt.textContent = Math.ceil(player.health);
  }
}

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;
  if(gameRunning) update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

/* ============================================================
   СТАРТ / РЕСТАРТ / РЕСАЙЗ
============================================================ */
const startScreen = document.getElementById('startScreen');
const gameOverEl  = document.getElementById('gameOver');

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startScreen.style.display = 'none';
  gameOverEl.classList.remove('show');
  gameRunning = true;
  lastTime = performance.now();

  const el = document.documentElement;
  try {
    if(el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(_){}
  try {
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  } catch(_){}
}

function endGame(){
  gameRunning = false;
  firing = false;
  fireBtn.classList.remove('active');
  document.getElementById('finalScore').textContent = kills;
  gameOverEl.classList.add('show');
}

function resetGame(){
  for(let i = enemies.length - 1; i >= 0; i--) enemies[i].remove();
  for(let i = effects.length - 1; i >= 0; i--){
    scene.remove(effects[i].obj);
    if(effects[i].obj.geometry) effects[i].obj.geometry.dispose();
    if(effects[i].obj.material) effects[i].obj.material.dispose();
  }
  effects.length = 0;
  for(let i = tracers.length - 1; i >= 0; i--){
    scene.remove(tracers[i].mesh);
    tracers[i].mat.dispose();
  }
  tracers.length = 0;
  for(let i = shells.length - 1; i >= 0; i--){
    scene.remove(shells[i].mesh);
    shells[i].mesh.geometry.dispose();
    shells[i].mesh.material.dispose();
  }
  shells.length = 0;

  player.pos.set(0, 0, 0);
  player.yaw = 0;
  player.pitch = 0;
  player.health = 100;

  ammo = MAG_SIZE;
  reloading = false;
  reloadTimer = 0;
  fireCooldown = 0;
  firing = false;
  kills = 0;
  spawnTimer = 1.5;
  damageAlpha = 0;

  camRecoilPitch = camRecoilYaw = 0;
  gunRecoilZ = gunRecoilPitch = gunRecoilYaw = gunRecoilRoll = 0;
  gunRecoilZVel = gunRecoilPitchVel = gunRecoilYawVel = gunRecoilRollVel = 0;
  shotsInBurst = 0;
  crosshairSpread = 0;
  crosshair.style.setProperty('--gap', '7px');

  camRoll = 0;
  camShakeX = camShakeY = camShakeR = 0;
  swayX = swayY = swayVX = swayVY = 0;
  bobX = bobY = bobRoll = 0;
  bobAmount = 0;
  stepPhase = 0;
  lastStepPhase = 0;
  stepDip = 0;
  flashT = 0;
  blurLevel = 0;
  speedBlurEl.style.opacity = '0';
  chromaEdgeEl.style.opacity = '0';
  prevYaw = 0;
  prevPitch = 0;

  aiming = false;
  aimT = 0;
  scopeBtn.classList.remove('active');
  camera.fov = FOV_HIP;
  camera.updateProjectionMatrix();

  healthBar.style.width = '100%';
  healthTxt.textContent = '100';
  document.getElementById('score').textContent = '0';
  updateAmmoHUD();
  reloadBtn.classList.remove('active');
  crosshair.style.opacity = '1';
}

document.getElementById('startBtn').addEventListener('click', () => {
  resetGame(); startGame();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  resetGame(); startGame();
});

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

document.addEventListener('touchmove', e => {
  if(e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

updateAmmoHUD();
</script>
